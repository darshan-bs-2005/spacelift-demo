---
- name: Install nginx
  hosts: all
  become: true
  gather_facts: false

  vars:
    ansible_python_interpreter: /usr/bin/python3.9

  tasks:

    - name: Install Python 3.9 and python3-apt
      ansible.builtin.raw: |
        apt-get update
        apt-get install -y python3.9 python3-apt
      changed_when: false
      check_mode: false

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
