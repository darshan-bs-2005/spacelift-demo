---
- name: Install nginx
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Install Python 3
      ansible.builtin.raw: |
        apt-get update
        apt-get install -y python3
      changed_when: false
      check_mode: false

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
